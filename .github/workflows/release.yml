# Gera os instaladores das tres plataformas a cada tag v*.
# O .exe "baixavel sem compilar" nasce aqui: a release publica o instalador
# NSIS/MSI do Windows, AppImage/deb do Linux e dmg do macOS.
name: release

on:
  push:
    tags: ["v*"]

# o token padrao e' so-leitura; criar a release e subir instaladores exige isto
permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform: [windows-latest, ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: dtolnay/rust-toolchain@stable
      - name: dependencias de sistema (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          # libdbus-1-dev: exigido pela crate bluer (fone via BlueZ no Linux)
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev
      - run: npm ci
      - name: instalador do Equalizer APO para embutir (Windows)
        if: matrix.platform == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force src-tauri/resources | Out-Null
          curl.exe -L -s -o src-tauri/resources/EqualizerAPO-x64-1.4.2.exe "https://sourceforge.net/projects/equalizerapo/files/1.4.2/EqualizerAPO-x64-1.4.2.exe/download"
          $tam = (Get-Item src-tauri/resources/EqualizerAPO-x64-1.4.2.exe).Length
          if ($tam -lt 5MB) { throw "download do EqualizerAPO veio incompleto ($tam bytes)" }
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "NothingAppX ${{ github.ref_name }}"
          releaseDraft: true
