[package]
name = "app"
version = "0.3.6"
description = "Controle de fones Nothing/CMF no desktop"
authors = ["projeto NothingAppX"]
license = "GPL-3.0"
repository = ""
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
tauri-plugin-single-instance = "2"

# transporte Bluetooth nativo (Windows); em Linux/mac o app abre sem ele por ora
[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
    "Devices_Bluetooth",
    "Devices_Bluetooth_Rfcomm",
    "Devices_Enumeration",
    "Foundation",
    "Foundation_Collections",
    "Networking_Sockets",
    "Storage_Streams",
    # deteccao do endpoint de audio padrao (registro do EqAPO por endpoint)
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_Foundation",
]

[target.'cfg(windows)'.dependencies.winreg]
version = "0.52"
