<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NothingAppX</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="tela">

  <header class="barra">
    <h1 class="titulo" data-i18n="app.titulo">Meus dispositivos</h1>
    <div class="barra-acoes">
      <select id="seletor-modelo" class="seletor-idioma" data-i18n-title="app.modelo"></select>
      <select id="seletor-idioma" class="seletor-idioma" data-i18n-title="idioma"></select>
      <button class="icone-redondo" data-i18n-title="app.conta">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.4"/><path d="M5 20c0-3.6 3.1-5.6 7-5.6s7 2 7 5.6"/></svg>
      </button>
    </div>
  </header>

  <div class="chips">
    <button class="chip-dispositivo">
      <svg viewBox="0 0 24 24" class="mini-buds"><path d="M8 4c1.6 0 2.6 1.3 2.6 3.1S9.6 12 8 12 5.4 9 5.4 7.1 6.4 4 8 4z"/><path d="M8.6 12v5.4"/><path d="M16 4c1.6 0 2.6 1.3 2.6 3.1S17.6 12 16 12s-2.6-3-2.6-4.9S14.4 4 16 4z"/><path d="M16.6 12v5.4"/></svg>
      <span class="ponto-online" id="ponto-conexao"></span>
    </button>
    <button class="chip-add" data-i18n-title="app.adicionar">+</button>
  </div>

  <p class="aviso-modelo" id="aviso-modelo" data-i18n="aviso.naoConfirmado" hidden></p>

  <section class="hero">
    <div class="ilustracao">
      <svg viewBox="0 0 260 190" class="buds-svg">
        <defs>
          <linearGradient id="corpo" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#4A5570"/><stop offset="55%" stop-color="#2B3346"/><stop offset="100%" stop-color="#171C28"/>
          </linearGradient>
          <linearGradient id="brilho" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#fff" stop-opacity=".38"/><stop offset="45%" stop-color="#fff" stop-opacity="0"/>
          </linearGradient>
        </defs>
        <g class="bud esquerdo">
          <ellipse cx="78" cy="52" rx="34" ry="30" fill="url(#corpo)"/>
          <ellipse cx="70" cy="44" rx="20" ry="16" fill="url(#brilho)"/>
          <rect x="66" y="72" width="26" height="88" rx="13" fill="url(#corpo)"/>
          <rect x="70" y="78" width="9" height="60" rx="4.5" fill="url(#brilho)"/>
          <circle cx="86" cy="50" r="4.6" fill="#0C1018" opacity=".85"/>
        </g>
        <g class="bud direito">
          <ellipse cx="182" cy="52" rx="34" ry="30" fill="url(#corpo)"/>
          <ellipse cx="174" cy="44" rx="20" ry="16" fill="url(#brilho)"/>
          <rect x="168" y="72" width="26" height="88" rx="13" fill="url(#corpo)"/>
          <rect x="172" y="78" width="9" height="60" rx="4.5" fill="url(#brilho)"/>
          <circle cx="174" cy="50" r="4.6" fill="#0C1018" opacity=".85"/>
        </g>
      </svg>
    </div>

    <h2 class="nome-dispositivo" id="nome-dispositivo" data-i18n="app.semDispositivo">Nenhum fone conectado</h2>

    <div class="baterias">
      <div class="bateria"><div class="trilho"><div class="nivel" id="bat-l-barra"></div></div><span id="bat-l-txt">—</span></div>
      <div class="bateria" id="bat-case-wrap" hidden><div class="trilho"><div class="nivel" id="bat-c-barra"></div></div><span id="bat-c-txt">—</span></div>
      <div class="bateria"><div class="trilho"><div class="nivel" id="bat-r-barra"></div></div><span id="bat-r-txt">—</span></div>
    </div>

    <button class="botao-conectar" id="btn-conectar" data-i18n="app.conectar">Conectar</button>
  </section>

  <!-- cancelamento de ruído -->
  <section class="cartao" data-recurso="anc">
    <div class="cartao-cabecalho">
      <div><h3 data-i18n="anc.titulo">Cancelamento de ruído</h3><p class="sub" id="anc-estado">—</p></div>
    </div>
    <div class="modos">
      <button class="modo" data-anc="1">
        <span class="disco"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2.4" fill="currentColor" stroke="none"/></svg></span>
        <span class="rotulo" data-i18n="anc.modo.1">Cancelamento</span>
      </button>
      <button class="modo" data-anc="2">
        <span class="disco"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5" stroke-dasharray="2.2 3.4"/><circle cx="12" cy="12" r="3.4" stroke-dasharray="2 3"/></svg></span>
        <span class="rotulo" data-i18n="anc.modo.2">Transparência</span>
      </button>
      <button class="modo" data-anc="0">
        <span class="disco"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><line x1="6" y1="18" x2="18" y2="6"/></svg></span>
        <span class="rotulo" data-i18n="anc.modo.0">Desligado</span>
      </button>
    </div>
    <div class="niveis" id="niveis-anc">
      <button class="nivel-opcao" data-nivel="0"><span class="marca"></span><span data-i18n="anc.nivel.0">Baixo</span></button>
      <button class="nivel-opcao" data-nivel="1"><span class="marca"></span><span data-i18n="anc.nivel.1">Médio</span></button>
      <button class="nivel-opcao" data-nivel="2"><span class="marca"></span><span data-i18n="anc.nivel.2">Alto</span></button>
      <button class="nivel-opcao" data-nivel="3"><span class="marca"></span><span data-i18n="anc.nivel.3">Adaptativo</span></button>
    </div>
  </section>

  <!-- áudio espacial -->
  <section class="cartao" data-recurso="espacial">
    <div class="cartao-cabecalho">
      <div><h3 data-i18n="espacial.titulo">Áudio espacial</h3></div>
      <button class="reticencias">•••</button>
    </div>
    <div class="modos dois">
      <button class="modo" data-espacial="1">
        <span class="disco"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 4v2M12 18v2M4 12h2M18 12h2M6.5 6.5l1.4 1.4M16.1 16.1l1.4 1.4M17.5 6.5l-1.4 1.4M7.9 16.1l-1.4 1.4"/></svg></span>
        <span class="rotulo" data-i18n="espacial.fixo">Fixo</span>
      </button>
      <button class="modo" data-espacial="0">
        <span class="disco"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7.5"/><circle cx="12" cy="12" r="2.6" fill="currentColor" stroke="none"/></svg></span>
        <span class="rotulo" data-i18n="espacial.off">Desligado</span>
      </button>
    </div>
    <p class="indisponivel" data-i18n="espacial.aviso"></p>
  </section>

  <!-- grade 2 × 4 -->
  <div class="grade">

    <section class="cartao compacto" data-recurso="ultraBass">
      <h3 data-i18n="bass.titulo">Ultra bass</h3>
      <p class="sub" id="bass-estado">—</p>
      <div class="rodape-cartao">
        <button class="interruptor" id="bass-toggle" role="switch" aria-checked="false"><span></span></button>
        <div class="barrinhas" id="bass-nivel" role="group" data-i18n-title="bass.escolherNivel">
          <button data-bass="1"><i></i></button>
          <button data-bass="2"><i></i></button>
          <button data-bass="3"><i></i></button>
          <button data-bass="4"><i></i></button>
          <button data-bass="5"><i></i></button>
        </div>
      </div>
    </section>

    <section class="cartao compacto" data-recurso="audiodo">
      <h3 data-i18n="perfil.titulo">Perfil sonoro pessoal</h3>
      <p class="sub" id="perfil-estado">—</p>
      <div class="rodape-cartao">
        <button class="interruptor" id="perfil-toggle" role="switch" aria-checked="false"><span></span></button>
        <svg class="onda" style="margin:0" viewBox="0 0 60 24"><g stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
          <line x1="4" y1="14" x2="4" y2="18"/><line x1="10" y1="10" x2="10" y2="20"/><line x1="16" y1="6" x2="16" y2="22"/>
          <line x1="22" y1="11" x2="22" y2="19"/><line x1="28" y1="4" x2="28" y2="22"/><line x1="34" y1="9" x2="34" y2="20"/>
          <line x1="40" y1="13" x2="40" y2="18"/><line x1="46" y1="7" x2="46" y2="21"/><line x1="52" y1="12" x2="52" y2="17"/>
        </g></svg>
      </div>
    </section>

    <section class="cartao compacto" id="cartao-eq">
      <h3 data-i18n="eq.titulo">Equalizador</h3>
      <p class="sub" id="eq-estado">—</p>
      <div class="miniatura-eq"><canvas id="eq-mini" width="120" height="120"></canvas></div>
    </section>

    <section class="cartao compacto" data-recurso="gestos" id="cartao-controles">
      <h3 data-i18n="controles.titulo">Controles</h3>
      <p class="sub" id="controles-estado">—</p>
      <svg class="onda" viewBox="0 0 60 24">
        <circle cx="14" cy="12" r="3" fill="currentColor"/><circle cx="26" cy="12" r="3" fill="currentColor"/>
        <rect x="36" y="10.4" width="16" height="3.2" rx="1.6" fill="currentColor"/>
      </svg>
    </section>

    <section class="cartao compacto" data-recurso="latencia">
      <h3 data-i18n="latencia.titulo">Modo baixa latência</h3>
      <p class="sub" id="latencia-estado">—</p>
      <div class="rodape-cartao">
        <button class="interruptor" id="latencia-toggle" role="switch" aria-checked="false"><span></span></button>
      </div>
    </section>

    <section class="cartao compacto indisponivel-cartao" data-recurso="dupla">
      <h3 data-i18n="dupla.titulo">Conexão dupla</h3>
      <p class="sub" id="dupla-estado">—</p>
      <svg class="onda" viewBox="0 0 60 24">
        <path d="M18 8h24l-6 4 6 4H18l6-4z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
      </svg>
    </section>

    <section class="cartao compacto">
      <h3 data-i18n="config.titulo">Configurações do dispositivo</h3>
      <p class="sub">—</p>
      <svg class="onda" viewBox="0 0 60 24">
        <circle cx="30" cy="12" r="4" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <circle cx="30" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.6" stroke-dasharray="3 3.4"/>
      </svg>
    </section>

    <section class="cartao compacto">
      <h3 data-i18n="sobre.titulo">Sobre</h3>
      <p class="sub" id="sobre-estado">—</p>
      <svg class="onda" viewBox="0 0 60 24">
        <circle cx="30" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="1.6"/>
        <line x1="30" y1="10.5" x2="30" y2="16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
        <circle cx="30" cy="7.8" r="1.1" fill="currentColor"/>
      </svg>
    </section>

  </div>

  <footer class="rodape">
    <span id="rodape-firmware">—</span><span class="separador">·</span><span id="rodape-codec">—</span>
  </footer>

</div>


<!-- ============================ painel: equalizador ==================== -->
<div class="painel" id="painel-eq" hidden>
  <div class="painel-caixa">
    <header class="painel-topo">
      <button class="painel-voltar" id="eq-voltar" aria-label="voltar">&#8592;</button>
      <h2 data-i18n="eq.titulo">Equalizador</h2>
    </header>
    <canvas id="eq-curva" class="eq-curva"></canvas>
    <p class="painel-nota" id="eq-nota">&#8212;</p>
    <div class="lista-presets" id="lista-presets"></div>
    <div id="eq-bandas" hidden>
      <p class="painel-nota" data-i18n="eq.editar" style="margin-top:16px"></p>
    </div>
  </div>
</div>

<!-- ============================ painel: controles ====================== -->
<div class="painel" id="painel-gestos" hidden>
  <div class="painel-caixa">
    <header class="painel-topo">
      <button class="painel-voltar" id="gestos-voltar" aria-label="voltar">&#8592;</button>
      <h2 data-i18n="controles.titulo">Controles</h2>
    </header>
    <p class="painel-nota" data-i18n="controles.ajuda"></p>
    <div id="lista-gestos"></div>
  </div>
</div>


<!-- ============================ painel: teste de audicao =============== -->
<div class="painel" id="painel-audio" hidden>
  <div class="painel-caixa">
    <header class="painel-topo">
      <button class="painel-voltar" id="audio-voltar" aria-label="voltar">&#8592;</button>
      <h2 data-i18n="audio.titulo">Teste de audição</h2>
    </header>

    <div id="audio-inicio">
      <p class="painel-nota" data-i18n="audio.intro"></p>
      <p class="painel-nota aviso-medico" data-i18n="audio.aviso"></p>
      <button class="botao-acao" id="audio-comecar" data-i18n="audio.comecar"></button>
    </div>

    <div id="audio-teste" hidden>
      <p class="audio-passo" id="audio-passo">&#8212;</p>
      <div class="audio-medidor"><div id="audio-barra"></div></div>
      <button class="botao-acao" id="audio-ouvi" data-i18n="audio.ouvi"></button>
      <p class="painel-nota" data-i18n="audio.dica"></p>
    </div>

    <div id="audio-fim" hidden>
      <canvas id="audio-grafico" class="eq-curva" style="height:150px"></canvas>
      <p class="painel-nota" id="audio-resumo"></p>
      <p class="painel-nota aviso-medico" data-i18n="audio.camada"></p>
      <button class="botao-acao" id="audio-aplicar" data-i18n="audio.aplicar"></button>

      <div class="bloco-sistema">
        <h3 data-i18n="sis.titulo"></h3>
        <p class="painel-nota" data-i18n="sis.explica"></p>
        <pre class="previa" id="sis-previa"></pre>
        <button class="preset" id="sis-apo" style="width:100%;margin-bottom:8px"
                data-i18n="sis.baixarApo"></button>
        <button class="preset" id="sis-csv" style="width:100%" data-i18n="sis.baixarCsv"></button>
        <p class="painel-nota" data-i18n="sis.passos"></p>
      </div>

      <div class="bloco-sistema">
        <h3 data-i18n="motor.titulo"></h3>
        <p class="painel-nota" data-i18n="motor.explica"></p>
        <select id="motor-entrada"></select>
        <button class="botao-acao" id="motor-ligar" style="margin-bottom:8px" data-i18n="motor.ligar"></button>
        <div id="motor-medidor" class="motor-medidor" hidden></div>
        <p class="painel-nota" data-i18n="motor.cabo"></p>
      </div>
      <button class="preset" id="audio-refazer" style="width:100%" data-i18n="audio.refazer"></button>
    </div>
  </div>
</div>

<script src="i18n.js"></script>
<script src="dispositivos.js"></script>
<script src="protocolo.js"></script>
<script src="telas.js"></script>
<script src="audiometria.js"></script>
<script src="perfil_sistema.js"></script>
<script src="motor_audio.js"></script>
<script src="app.js"></script>
</body>
</html>
